# ⚠️ ده تمبلت بس — القيم الحقيقية اتطبّقت مباشرة على الكلاستر بـ kubectl
# (مش متخزنة في الريبو). لو محتاج تعيد إنشاء الـ Secret، انسخ الملف ده،
# احط القيم الحقيقية، وشغّل: kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: step-backend-secrets
  namespace: step
type: Opaque
stringData:
  DATABASE_URL: "postgresql://step:<POSTGRES_PASSWORD>@step-postgres.step.svc.cluster.local:5432/step_db"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  JWT_SECRET: "<JWT_SECRET>"
  JWT_EXPIRES_IN: "7d"
  ADMIN_INVITE_CODE: "<ADMIN_INVITE_CODE>"
  MAIL_HOST: "smtp.titan.email"
  MAIL_PORT: "465"
  MAIL_USER: "support.solar@ma-hb.com"
  MAIL_PASS: "<MAIL_PASS>"
  MAIL_FROM: "Step <support.solar@ma-hb.com>"
